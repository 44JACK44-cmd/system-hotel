<p-toast position="top-center" />
<aside class="hs-sidebar hs-sidebar-wrapper">
  <div class="hs-sidebar__header">
    @if (logoSrc) {
      <img [src]="logoSrc" alt="Logo" class="hs-sidebar__logo" />
    } @else {
      <span class="material-symbols-outlined hs-sidebar__hotel-icon" style="font-size:32px" aria-hidden="true">hotel</span>
    }
    <div>
      <div class="hs-sidebar__branch">{{ hotelNombre }}</div>
      <div class="hs-sidebar__role">{{ rolLabel }}</div>
    </div>
  </div>

  <div class="hs-sidebar__body">
    <nav class="hs-sidebar__nav hs-scroll" role="navigation" aria-label="Navegación principal">
      @for (item of filteredMenu; track item.route) {
        <a [routerLink]="item.route"
           class="hs-sidebar__nav-item"
           routerLinkActive="sidebar-nav-active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="onNavClick()">
           <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span class="hs-sidebar__nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <div class="hs-sidebar__footer">
    <button type="button" class="hs-sidebar__nav-item hs-sidebar__nav-item--sm" (click)="centroAyuda()">
      <span class="material-symbols-outlined" aria-hidden="true">help</span>
      <span class="hs-sidebar__nav-label">Centro de Ayuda</span>
    </button>
    <button type="button" class="hs-sidebar__nav-item hs-sidebar__nav-item--sm hs-sidebar__nav-item--danger"
       (click)="logout()">
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
      <span class="hs-sidebar__nav-label">Cerrar Sesión</span>
    </button>
  </div>
</aside>
