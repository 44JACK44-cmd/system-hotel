<div class="hs-overlay" (click)="cerrar()"></div>
<div class="hs-slide-panel">
  <div class="hs-slide-panel__header" style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--aura-gold),var(--aura-gold-dark));display:flex;align-items:center;justify-content:center">
        <span class="material-symbols-outlined" style="color:var(--aura-dark);font-size:20px">payments</span>
      </div>
      <div>
        <span style="font-weight:700;font-size:16px;color:white">Registrar Pago</span>
        <p style="margin:0;font-size:11px;color:rgba(255,255,255,0.5)">Nuevo ingreso en caja</p>
      </div>
    </div>
    <button class="hs-topbar__icon-btn" (click)="cerrar()">
      <span class="material-symbols-outlined" style="color:rgba(255,255,255,0.6)">close</span>
    </button>
  </div>
  <p-toast position="top-center" />

  <div class="hs-slide-panel__body" style="gap:20px;display:flex;flex-direction:column;padding:24px">
    <div class="pag-form-layout">
      <div class="pag-form-row">
        <div class="premium-field">
          <label>Tipo de Pago</label>
          <p-select [(ngModel)]="tipo" [options]="tipos" optionLabel="label" optionValue="value" placeholder="Seleccionar tipo" styleClass="w-full" appendTo="body" />
        </div>
        <div class="premium-field">
          <label>Monto (S/)</label>
          <p-inputnumber [(ngModel)]="monto" [minFractionDigits]="2" [maxFractionDigits]="2" [min]="0.01" placeholder="0.00" inputStyleClass="premium-input" styleClass="w-full" />
        </div>
      </div>

      <div class="pag-form-row">
        <div class="premium-field">
          <label>M&eacute;todo</label>
          <div class="pm-radio-row">
            <label class="pm-radio-label">
              <input type="radio" name="metodo" [(ngModel)]="metodo" value="YAPE" />
              <span>YAPE</span>
            </label>
            <label class="pm-radio-label">
              <input type="radio" name="metodo" [(ngModel)]="metodo" value="EFECTIVO" />
              <span>EFECTIVO</span>
            </label>
          </div>
        </div>
        <div class="premium-field">
          <label>Referencia</label>
          <input class="premium-input" type="text" [(ngModel)]="referencia" placeholder="Opcional" maxlength="100" />
        </div>
      </div>

      <div class="premium-divider"><span>Vincular a</span></div>

      <div class="pag-form-row">
        <div class="premium-field">
          <label>Reserva</label>
          <p-autocomplete [(ngModel)]="reservaObj" [suggestions]="reservasBuscadas"
            (completeMethod)="buscarReservas($event)" (onSelect)="onReservaSelect($event)"
            optionLabel="label" [dropdown]="false" [minQueryLength]="2"
            placeholder="Buscar reserva..." inputStyleClass="premium-input" styleClass="suggest-fullwidth"
            [ngModelOptions]="{standalone: true}" />
        </div>
        <div class="premium-field">
          <label>Hospedaje</label>
          <p-autocomplete [(ngModel)]="hospedajeObj" [suggestions]="hospedajesBuscados"
            (completeMethod)="buscarHospedajes($event)" (onSelect)="onHospedajeSelect($event)"
            optionLabel="label" [dropdown]="false" [minQueryLength]="2"
            placeholder="Buscar hospedaje..." inputStyleClass="premium-input" styleClass="suggest-fullwidth"
            [ngModelOptions]="{standalone: true}" />
        </div>
      </div>
    </div>
  </div>

  <div class="hs-slide-panel__footer" style="padding:16px 24px;gap:12px">
    <button class="premium-btn" style="flex:1;background:transparent;color:var(--clr-on-surface-variant);box-shadow:none;border:1px solid var(--clr-outline-variant);justify-content:center;padding:12px" (click)="cerrar()">
      Cancelar
    </button>
    <button class="premium-btn" style="flex:1;justify-content:center;padding:12px"
      [disabled]="!puedeGuardar() || loading" (click)="guardar()">
      @if (loading) {
        <span class="material-symbols-outlined" style="animation:spin 1s linear infinite">sync</span>
      }
      <span class="material-symbols-outlined">payments</span>
      Registrar Pago
    </button>
  </div>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
