<div class="hs-overlay" (click)="cerrar()"></div>
<div class="hs-slide-panel hs-slide-panel--wide">
  <div class="hs-slide-panel__header">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:36px;height:36px;background:var(--clr-primary-container);color:var(--clr-white);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <span class="material-symbols-outlined" style="font-size:18px">payments</span>
      </div>
      <div>
        <span style="font-weight:700;font-size:16px;color:var(--clr-white);margin:0">Registrar Pago</span>
        <p style="margin:0;font-size:11px;color:var(--clr-outline)">Nuevo ingreso en caja</p>
      </div>
    </div>
    <button class="hs-topbar__icon-btn" (click)="cerrar()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <p-toast position="top-center" />

  <div class="hs-slide-panel__body pag-body">

    <div class="pag-accent-panel">
      <div class="pag-accent-header">
        <span class="pag-accent-title">DATOS DEL PAGO</span>
      </div>
      <div class="pag-accent-body">
        <div class="pag-form-row">
          <div class="pag-field">
            <label class="pag-field-label">Tipo de Pago</label>
            <p-select [(ngModel)]="tipo" [options]="tipos" optionLabel="label" optionValue="value" placeholder="Seleccionar tipo" styleClass="w-full" appendTo="body" />
          </div>
          <div class="pag-field">
            <label class="pag-field-label">Monto (S/)</label>
            <p-inputnumber [(ngModel)]="monto" [minFractionDigits]="2" [maxFractionDigits]="2" [min]="0.01" placeholder="0.00" inputStyleClass="pag-input" styleClass="w-full" />
          </div>
        </div>

        <div class="pag-form-row">
          <div class="pag-field">
            <label class="pag-field-label">M&eacute;todo</label>
            <div class="pag-radio-row">
              <label class="pag-radio-label" [class.pag-radio-label--active]="metodo==='YAPE'">
                <input type="radio" name="metodo" [(ngModel)]="metodo" value="YAPE" class="pag-radio-input" />
                <div class="pag-radio-circle">
                  <div class="pag-radio-dot"></div>
                </div>
                <span>YAPE</span>
              </label>
              <label class="pag-radio-label" [class.pag-radio-label--active]="metodo==='EFECTIVO'">
                <input type="radio" name="metodo" [(ngModel)]="metodo" value="EFECTIVO" class="pag-radio-input" />
                <div class="pag-radio-circle">
                  <div class="pag-radio-dot"></div>
                </div>
                <span>EFECTIVO</span>
              </label>
            </div>
          </div>
          <div class="pag-field">
            <label class="pag-field-label">Referencia</label>
            <input class="pag-input" type="text" [(ngModel)]="referencia" placeholder="Opcional" maxlength="100" aria-label="Referencia" />
          </div>
        </div>

        <div class="pag-divider"><span>Vincular a</span></div>

        <div class="pag-form-row">
          <div class="pag-field">
            <label class="pag-field-label">Reserva</label>
            <p-autocomplete [(ngModel)]="reservaObj" [suggestions]="reservasBuscadas"
              (completeMethod)="buscarReservas($event)" (onSelect)="onReservaSelect($event)"
              optionLabel="label" [dropdown]="false" [minQueryLength]="2"
              placeholder="Buscar reserva..." inputStyleClass="pag-input" styleClass="w-full"
              [ngModelOptions]="{standalone: true}" />
          </div>
          <div class="pag-field">
            <label class="pag-field-label">Hospedaje</label>
            <p-autocomplete [(ngModel)]="hospedajeObj" [suggestions]="hospedajesBuscados"
              (completeMethod)="buscarHospedajes($event)" (onSelect)="onHospedajeSelect($event)"
              optionLabel="label" [dropdown]="false" [minQueryLength]="2"
              placeholder="Buscar hospedaje..." inputStyleClass="pag-input" styleClass="w-full"
              [ngModelOptions]="{standalone: true}" />
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="hs-slide-panel__footer" style="justify-content:flex-end">
    <button class="pag-btn pag-btn-cancel" (click)="cerrar()">
      Cancelar
    </button>
    <button class="pag-btn pag-btn-primary"
      [disabled]="!puedeGuardar() || loading" (click)="guardar()">
      @if (loading) {
        <span class="material-symbols-outlined" style="animation:pag-spin 1s linear infinite">sync</span>
      }
      <span class="material-symbols-outlined">payments</span>
      Registrar Pago
    </button>
  </div>
</div>
