spring.application.name=apifds20261

# Active profile (dev / prod)
spring.profiles.active=dev

# JWT
# En produccion definir variable de entorno JWT_SECRET (obligatoria, >= 32 caracteres).
# Sin JWT_SECRET la aplicacion NO arranca (no existe secreto por defecto).
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging
logging.level.org.springframework=INFO

# Swagger UI & API Docs
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
