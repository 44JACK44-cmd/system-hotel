# ----- PROD Profile -----
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
# En produccion el esquema NO se modifica automaticamente. Las migraciones se aplican
# con scripts (bd/*.sql). Si una entidad no coincide con el esquema, la app no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

cors.allowed-origins=${FRONTEND_URL}
jwt.secret=${JWT_SECRET}
