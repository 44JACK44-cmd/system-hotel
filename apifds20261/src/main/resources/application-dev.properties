# ----- DEV Profile -----
# OJO: credenciales por defecto SOLO para desarrollo local (localhost).
# En produccion se usa el perfil 'prod' con variables de entorno (MYSQLUSER/MYSQLPASSWORD).
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/system_hotel
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Amilcar2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Secreto JWT para desarrollo local (nunca usar en produccion)
jwt.secret=desarrollo-secreto-local-no-usar-en-produccion-2026-cambiar

cors.allowed-origins=http://localhost:4200

# Multipart / subida de imagenes (logo, avatar, incidencias)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB

# Eleva el techo del POST (body JSON con data-URI base64 de incidencias)
spring.tomcat.max-http-form-post-size=10MB
